<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPLU / KTCM Aviation Weather</title>
  <style>
    :root{
      --bg:#0b1118;
      --panel:#101923;
      --panel2:#0d151e;
      --border:var(--db-border, #263543);
      --text:var(--db-text, #eef5fb);
      --muted:var(--db-muted, #8fa3b5);
      --soft:var(--db-soft, #c8d4de);
      --vfr:#19c36a;
      --mvfr:#2589ff;
      --ifr:#ef4444;
      --lifr:#d946ef;
      --warn:#f59e0b;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      background:transparent;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

      /* Hide browser scrollbars while preserving scrolling if needed */
      scrollbar-width:none;
      -ms-overflow-style:none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar{
      display:none;
      width:0;
      height:0;
    }

    body{padding:6px}

    .panel{
      width:100%;
      background:var(--db-shell-bg, rgba(11,17,24,.40));
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:6px 9px;
      border-bottom:1px solid var(--border);
      background:var(--db-toolbar-bg, rgba(10,17,24,.40));
    }

    .title{
      font-weight:800;
      letter-spacing:.08em;
      font-size:10px;
      line-height:1;
      color:var(--soft);
    }

    .status{
      display:flex;
      align-items:center;
      gap:6px;
      font-size:9px;
      color:var(--muted);
      white-space:nowrap;
    }

    .dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background:var(--vfr);
    }

    .dot.loading{background:var(--warn)}
    .dot.error{background:var(--ifr)}

    .station-header{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 9px;
      background:var(--db-tile-strong, rgba(16,25,35,.70));
    }

    .icao{
      font-size:20px;
      line-height:1;
      font-weight:900;
      letter-spacing:.04em;
    }

    .station-name{
      min-width:0;
      color:var(--muted);
      font-size:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      margin-left:auto;
      border-radius:7px;
      padding:5px 8px 4px;
      font-weight:900;
      font-size:13px;
      letter-spacing:.07em;
      line-height:1;
      color:white;
      background:#5c6670;
      min-width:66px;
      text-align:center;
    }

    .badge.VFR{background:var(--vfr)}
    .badge.MVFR{background:var(--mvfr)}
    .badge.IFR{background:var(--ifr)}
    .badge.LIFR{background:var(--lifr)}

    .metrics{
      display:grid;
      grid-template-columns:repeat(6,minmax(90px,1fr));
      gap:1px;
      background:var(--db-shell-bg, rgba(11,17,24,.40));
      border-top:1px solid var(--border);
      border-bottom:1px solid var(--border);
    }

    .metric{
      min-width:0;
      padding:7px;
      background:var(--db-tile-bg, rgba(13,21,30,.70));
    }

    .metric-label{
      color:var(--muted);
      font-size:9.6px;
      font-weight:850;
      letter-spacing:.10em;
      text-transform:uppercase;
      margin-bottom:4px;
    }

    .metric-value{
      font-size:13px;
      line-height:1.15;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .metric-sub{
      margin-top:3px;
      font-size:9.6px;
      line-height:1.2;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .section{
      padding:5px 9px 7px;
    }

    .section + .section{
      border-top:1px solid var(--border);
    }

    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:8px;
      margin-bottom:4px;
      font-size:9.6px;
      font-weight:850;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .section-title .time{
      text-transform:none;
      letter-spacing:0;
      font-weight:600;
      color:var(--muted);
    }

    .raw{
      margin:0;
      padding:7px 8px;
      border:1px solid var(--border);
      border-radius:8px;
      background:var(--db-tile-bg, rgba(13,21,30,.70));
      color:#e5edf5;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:11px;
      line-height:1.35;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .taf-head{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 9px;
      border-top:1px solid var(--border);
      background:var(--db-tile-strong, rgba(16,25,35,.70));
    }

    .taf-meta{
      color:var(--muted);
      font-size:9.6px;
      line-height:1.25;
    }

    .forecast-grid{
      display:grid;
      grid-template-columns:108px 74px 120px 100px 100px minmax(110px,1fr);
      border:1px solid var(--border);
      border-radius:9px;
      overflow:hidden;
      background:var(--db-shell-bg, rgba(11,17,24,.40));
      gap:1px;
    }

    .fh{
      padding:5px 6px;
      background:var(--db-toolbar-bg, rgba(10,17,24,.40));
      color:var(--muted);
      font-size:9px;
      font-weight:850;
      letter-spacing:.1em;
      text-transform:uppercase;
    }

    .fc{
      min-width:0;
      padding:6px;
      background:var(--db-tile-bg, rgba(13,21,30,.70));
      font-size:9.6px;
      line-height:1.25;
      display:flex;
      align-items:center;
    }

    .fc.mono{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
    }

    .cat-pill{
      display:inline-block;
      min-width:48px;
      padding:3px 6px;
      border-radius:5px;
      color:white;
      text-align:center;
      font-size:9.6px;
      font-weight:900;
      letter-spacing:.05em;
      background:#5c6670;
    }

    .cat-pill.VFR{background:var(--vfr)}
    .cat-pill.MVFR{background:var(--mvfr)}
    .cat-pill.IFR{background:var(--ifr)}
    .cat-pill.LIFR{background:var(--lifr)}

    .change{
      font-weight:900;
      color:var(--soft);
    }

    .errorbox{
      display:none;
      margin:12px 14px 14px;
      padding:12px;
      border:1px solid rgba(239,68,68,.5);
      background:rgba(127,29,29,.42);
      border-radius:8px;
      color:#fecaca;
      font-size:10.4px;
      line-height:1.4;
    }

    .errorbox.show{display:block}

    @media(max-width:900px){
      .metrics{grid-template-columns:repeat(3,1fr)}
      .forecast-grid{grid-template-columns:94px 62px 105px 90px 90px minmax(100px,1fr)}
    }

    @media(max-width:650px){
      body{padding:4px}
      .topbar{padding:5px 8px}
      .station-header,.taf-head{padding:6px 7px}
      .section{padding:4px 7px 6px}
      .metrics{grid-template-columns:repeat(2,1fr)}
      .metric{padding:6px}
      .icao{font-size:18px}
      .badge{font-size:12px;min-width:62px}
      .raw{font-size:10.5px}
    }

    /* Tall / narrow DAKboard windows:
       switch the TAF timeline from a horizontal grid into stacked forecast cards. */
    .forecast-row{
      display:none;
    }

    @media(max-width:560px){
      .wide-forecast-cell{
        display:none !important;
      }

      .forecast-row{
        display:block;
      }

      .forecast-wrap{
        overflow:visible;
      }

      .forecast-grid{
        display:block;
        min-width:0;
        border:0;
        border-radius:0;
        background:transparent;
      }

      .forecast-grid > .fh{
        display:none;
      }

      .forecast-row{
        display:block;
        margin-bottom:6px;
        border:1px solid var(--border);
        border-radius:8px;
        overflow:hidden;
        background:var(--db-tile-bg, rgba(13,21,30,.70));
      }

      .forecast-row:last-child{
        margin-bottom:0;
      }

      .forecast-cell{
        display:grid;
        grid-template-columns:70px minmax(0,1fr);
        align-items:center;
        min-width:0;
        padding:5px 7px;
        border-top:1px solid var(--border);
        background:var(--db-tile-bg, rgba(13,21,30,.70));
        font-size:9.6px;
        line-height:1.3;
      }

      .forecast-cell:first-child{
        border-top:0;
      }

      .forecast-cell::before{
        content:attr(data-label);
        color:var(--muted);
        font-size:9px;
        font-weight:850;
        letter-spacing:.09em;
        text-transform:uppercase;
        padding-right:8px;
      }

      .forecast-period{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:8px;
        padding:5px 7px;
        background:var(--db-toolbar-bg, rgba(10,17,24,.40));
        border-bottom:1px solid var(--border);
      }

      .forecast-period .period-text{
        font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,
          "Liberation Mono","Courier New",monospace;
        font-size:9.6px;
        font-weight:900;
        color:var(--soft);
      }

      .forecast-period .cat-pill{
        flex:0 0 auto;
      }

      .taf-head{
        align-items:flex-start;
      }

      .taf-meta{
        font-size:9.6px;
      }
    }
  </style>
  <link rel="stylesheet" href="../shared/dashboard-theme.css">
</head>

<body>
  <main class="panel">
    <header class="topbar">
      <div class="title">AVIATION WEATHER</div>
      <div class="status">
        <span id="statusDot" class="dot loading"></span>
        <span id="updateText">Loading CheckWX…</span>
      </div>
    </header>

    <section>
      <div class="station-header">
        <div class="icao">KPLU</div>
        <div id="metarStation" class="station-name">Thun Field</div>
        <div id="metarCategory" class="badge">—</div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Wind</div>
          <div id="wind" class="metric-value">—</div>
          <div id="windSub" class="metric-sub">&nbsp;</div>
        </div>
        <div class="metric">
          <div class="metric-label">Visibility</div>
          <div id="visibility" class="metric-value">—</div>
          <div id="visibilitySub" class="metric-sub">&nbsp;</div>
        </div>
        <div class="metric">
          <div class="metric-label">Ceiling</div>
          <div id="ceiling" class="metric-value">—</div>
          <div id="ceilingSub" class="metric-sub">&nbsp;</div>
        </div>
        <div class="metric">
          <div class="metric-label">Altimeter</div>
          <div id="altimeter" class="metric-value">—</div>
          <div id="altimeterSub" class="metric-sub">&nbsp;</div>
        </div>
        <div class="metric">
          <div class="metric-label">Temp / Dew</div>
          <div id="tempDew" class="metric-value">—</div>
          <div id="tempDewSub" class="metric-sub">&nbsp;</div>
        </div>
        <div class="metric">
          <div class="metric-label">Weather</div>
          <div id="conditions" class="metric-value">—</div>
          <div id="conditionsSub" class="metric-sub">&nbsp;</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>Raw METAR</span>
          <span id="metarTime" class="time"></span>
        </div>
        <pre id="rawMetar" class="raw">Loading KPLU METAR…</pre>
      </div>
    </section>

    <section>
      <div class="taf-head">
        <div class="icao">KTCM</div>
        <div>
          <div id="tafStation" class="station-name">McChord Field</div>
          <div id="tafMeta" class="taf-meta">Loading forecast…</div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>Forecast Timeline</span>
          <span class="time">UTC / Zulu</span>
        </div>
        <div class="forecast-wrap">
          <div id="forecastGrid" class="forecast-grid">
            <div class="fh">Period</div>
            <div class="fh">Cat</div>
            <div class="fh">Wind</div>
            <div class="fh">Vis</div>
            <div class="fh">Ceiling</div>
            <div class="fh">Weather</div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span>Raw TAF</span>
          <span id="tafTime" class="time"></span>
        </div>
        <pre id="rawTaf" class="raw">Loading KTCM TAF…</pre>
      </div>
    </section>

    <div id="errorBox" class="errorbox"></div>
  </main>

<script type="module" src="./aviation.js"></script>
</body>
</html>
