<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviation Strip</title>
  <style>
    :root {
      --vfr:#19c36a;
      --mvfr:#2589ff;
      --ifr:#ef4444;
      --lifr:#d946ef;
      --warn:#f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      color: var(--db-text, #eef5fb);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }

    body { padding: 4px; }

    .strip {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--db-border, #263543);
      border-radius: var(--db-corner, 10px);
      background: var(--db-tile-bg, rgba(13,21,30,.60));
      overflow: hidden;
    }

    /* One row per station. */
    .rows {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .row {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 0;
      padding: 2px 8px;
      border-top: 1px solid var(--db-grid-line, rgba(150,170,188,.20));
    }
    .row:first-child { border-top: 0; }

    .icao {
      flex: 0 0 auto;
      font-weight: 900;
      font-size: 14px;
      letter-spacing: .03em;
      min-width: 3.2em;
    }

    /* The raw METAR/TAF string. Stays on one line and scrolls horizontally when
       it overflows the strip width; times and ceilings are in the raw text. */
    .raw {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      line-height: 1.2;
      color: var(--db-soft, #c8d4de);
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .raw::-webkit-scrollbar { display: none; height: 0; }

    /* TAF row: a horizontal, scrollable timeline of category pills. */
    .taf-timeline {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .taf-timeline::-webkit-scrollbar { display: none; height: 0; }

    .tafpill {
      flex: 0 0 auto;
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
      color: #fff;
      background: #5c6670;
    }
    .tafpill.VFR { background: var(--vfr); }
    .tafpill.MVFR { background: var(--mvfr); }
    .tafpill.IFR { background: var(--ifr); }
    .tafpill.LIFR { background: var(--lifr); }

    .tafpill-t {
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      opacity: .85;
    }

    /* METAR station pill: ICAO + its flight category, colored by category. */
    .stnpill {
      flex: 0 0 auto;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .03em;
      color: #fff;
      background: #5c6670;
    }
    .stnpill.VFR { background: var(--vfr); }
    .stnpill.MVFR { background: var(--mvfr); }
    .stnpill.IFR { background: var(--ifr); }
    .stnpill.LIFR { background: var(--lifr); }
    .stnpill-id { opacity: .9; }

    /* Status is a thin footer that only appears on error to save vertical space. */
    .status {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-top: 1px solid var(--db-grid-line, rgba(150,170,188,.20));
      font-size: 8.5px;
      color: #fecaca;
    }
    .strip.is-error .status { display: flex; }
    .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--ifr); }
  </style>
  <link rel="stylesheet" href="../shared/dashboard-theme.css">
</head>
<body>
  <main id="strip" class="strip">
    <div id="rows" class="rows" aria-label="Aviation stations"></div>
    <div class="status">
      <span class="dot"></span>
      <span id="errorText">Unavailable</span>
    </div>
  </main>

  <script type="module" src="./aviation-strip.js"></script>
</body>
</html>
