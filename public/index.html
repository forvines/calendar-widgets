<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAKboard Calendar Prototype</title>

  <!-- FullCalendar v6 standard global build (injects its own base CSS). -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>

  <link rel="stylesheet" href="./src/styles/theme.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/fullcalendar.css" />
  <link rel="stylesheet" href="./src/styles/rolling-calendar.css" />

  <!-- Local-only demo background (public/local-demo.css is git-ignored and not
       deployed; this link 404s harmlessly in production where DAKboard
       supplies its own background). -->
  <link rel="stylesheet" href="./local-demo.css" />
</head>
<body>
  <main id="app" class="calendar-app">
    <header class="app-toolbar">
      <button id="reloadButton" class="reload-button" type="button" aria-label="Reload calendar" title="Reload calendar">↻</button>
      <div class="app-title">CALENDAR</div>
      <span id="sampleDataBadge" class="sample-badge" hidden>SAMPLE DATA</span>
      <div id="calendarFilters" class="calendar-filters" aria-label="Calendar visibility"></div>
    </header>

    <div id="calendarStatus" class="calendar-status" role="status">
      <span class="calendar-status-spinner" aria-hidden="true"></span>
      <span class="calendar-status-message">Loading calendars…</span>
      <button id="calendarRetry" class="text-button" type="button" hidden>Retry</button>
    </div>

    <div id="calendarContent" class="calendar-content" hidden>
      <div id="monthAccordion" class="month-accordion" tabindex="0" aria-label="Calendar weeks"></div>
    </div>

    <div id="eventOverlay" class="event-overlay" hidden>
      <div class="event-card" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
        <button id="eventClose" class="event-close" type="button" aria-label="Close event details">×</button>
        <div id="eventCalendarName" class="event-calendar-name"></div>
        <h2 id="eventTitle" class="event-detail-title"></h2>
        <div id="eventTime" class="event-detail-time"></div>
        <div id="eventLocation" class="event-detail-location"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
