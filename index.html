<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DAKboard Calendar Prototype</title>

  <!-- FullCalendar v7 standard browser bundle. No Google/API connection in Phase 1. -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/all/global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/classic/global.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/skeleton.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/classic/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.0.2/themes/classic/palette.css" />

  <link rel="stylesheet" href="./src/styles/theme.css" />
  <link rel="stylesheet" href="./src/styles/layout.css" />
  <link rel="stylesheet" href="./src/styles/fullcalendar.css" />
  <link rel="stylesheet" href="./src/styles/rolling-calendar.css" />
</head>
<body>
  <main id="app" class="calendar-app">
    <header class="app-toolbar">
      <div class="app-title">CALENDAR</div>
      <div id="calendarFilters" class="calendar-filters" aria-label="Calendar visibility"></div>
    </header>

    <section class="calendar-panel week-panel" aria-label="Current week schedule">
      <div class="panel-heading">
        <div>
          <div class="eyebrow">WEEK SCHEDULE</div>
          <div id="weekRange" class="panel-title">Current week</div>
        </div>
        <div class="week-actions" aria-label="Week navigation">
          <button id="prevDay" class="icon-button" type="button" aria-label="Previous day">‹</button>
          <button id="todayButton" class="text-button" type="button">Today</button>
          <button id="nextDay" class="icon-button" type="button" aria-label="Next day">›</button>
        </div>
      </div>
      <div class="week-calendar-frame">
        <div id="weekCalendar"></div>
      </div>
    </section>

    <section class="calendar-panel rolling-panel" aria-label="Upcoming weeks">
      <div class="panel-heading rolling-heading">
        <div>
          <div class="eyebrow">UPCOMING</div>
          <div class="panel-title">Rolling calendar</div>
        </div>
        <div class="heading-hint">Swipe/scroll vertically</div>
      </div>
      <div id="rollingCalendar" class="rolling-scroll" tabindex="0"></div>
    </section>

    <div id="eventOverlay" class="event-overlay" hidden>
      <div class="event-card" role="dialog" aria-modal="true" aria-labelledby="eventTitle">
        <button id="eventClose" class="event-close" type="button" aria-label="Close event details">×</button>
        <div id="eventCalendarName" class="event-calendar-name"></div>
        <h2 id="eventTitle" class="event-detail-title"></h2>
        <div id="eventTime" class="event-detail-time"></div>
        <div id="eventLocation" class="event-detail-location"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
