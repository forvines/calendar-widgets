name: Update lunch menu

on:
  workflow_dispatch:
  schedule:
    # Roughly 7:15-8:15 AM Pacific depending on daylight saving time.
    - cron: '15 15 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install PDF parser
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.4

      - name: Import current lunch menu
        run: python scripts/update_lunch_menu.py

      - name: Commit changed menu data
        shell: bash
        run: |
          if git diff --quiet -- public/data/lunch-menu.json; then
            echo "Lunch menu is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/lunch-menu.json
          git commit -m "Update lunch menu data"
          git push
